<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>auto-game-build dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>auto-game-build — live progress</h1>

  <div id="office">
    <div class="room room-director" data-role="director">
      <div class="deco deco-1">🖥️</div>
      <div class="deco deco-2">📋</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Director</span>
          <div class="avatar" style="--sprite-idle:url(/sprites/director_idle.png); --sprite-walk:url(/sprites/director_walk.png);"></div>
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-designer" data-role="designer">
      <div class="deco deco-1">🎨</div>
      <div class="deco deco-2">🪴</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Designer</span>
          <div class="avatar" style="--sprite-idle:url(/sprites/designer_idle.png); --sprite-walk:url(/sprites/designer_walk.png);"></div>
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-programmer" data-role="programmer">
      <div class="deco deco-1">💻</div>
      <div class="deco deco-2">☕</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Programmer</span>
          <div class="avatar" style="--sprite-idle:url(/sprites/programmer_idle.png); --sprite-walk:url(/sprites/programmer_walk.png);"></div>
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-artist" data-role="artist">
      <div class="deco deco-1">🖌️</div>
      <div class="deco deco-2">🖼️</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Artist</span>
          <div class="avatar" style="--sprite-idle:url(/sprites/artist_idle.png); --sprite-walk:url(/sprites/artist_walk.png);"></div>
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-tester" data-role="tester">
      <div class="deco deco-1">🔍</div>
      <div class="deco deco-2">🐞</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Tester</span>
          <div class="avatar" style="--sprite-idle:url(/sprites/tester_idle.png); --sprite-walk:url(/sprites/tester_walk.png);"></div>
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-fixer" data-role="fixer">
      <div class="deco deco-1">🔧</div>
      <div class="deco deco-2">🧰</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Fixer</span>
          <div class="avatar" style="--sprite-idle:url(/sprites/fixer_idle.png); --sprite-walk:url(/sprites/fixer_walk.png);"></div>
        </div>
      </div>
      <div class="detail"></div>
    </div>
  </div>

  <h2>Timeline</h2>
  <ul id="timeline"></ul>
  <script src="/app.js" type="module"></script>
</body>
</html>
