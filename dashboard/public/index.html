<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>auto-game-build dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>auto-game-build — live progress</h1>

  <div id="office">
    <div class="room room-director" data-role="director">
      <div class="deco deco-1">🖥️</div>
      <div class="deco deco-2">📋</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Director</span>
          <img class="avatar" src="/sprites/frames/director_idle_0.png" alt="Director" />
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-designer" data-role="designer">
      <div class="deco deco-1">🎨</div>
      <div class="deco deco-2">🪴</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Designer</span>
          <img class="avatar" src="/sprites/frames/designer_idle_0.png" alt="Designer" />
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-programmer" data-role="programmer">
      <div class="deco deco-1">💻</div>
      <div class="deco deco-2">☕</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Programmer</span>
          <img class="avatar" src="/sprites/frames/programmer_idle_0.png" alt="Programmer" />
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-artist" data-role="artist">
      <div class="deco deco-1">🖌️</div>
      <div class="deco deco-2">🖼️</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Artist</span>
          <img class="avatar" src="/sprites/frames/artist_idle_0.png" alt="Artist" />
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-tester" data-role="tester">
      <div class="deco deco-1">🔍</div>
      <div class="deco deco-2">🐞</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Tester</span>
          <img class="avatar" src="/sprites/frames/tester_idle_0.png" alt="Tester" />
        </div>
      </div>
      <div class="detail"></div>
    </div>
    <div class="room room-fixer" data-role="fixer">
      <div class="deco deco-1">🔧</div>
      <div class="deco deco-2">🧰</div>
      <div class="floor">
        <div class="avatar-wrap">
          <span class="nametag">Fixer</span>
          <img class="avatar" src="/sprites/frames/fixer_idle_0.png" alt="Fixer" />
        </div>
      </div>
      <div class="detail"></div>
    </div>
  </div>

  <h2>Timeline</h2>
  <ul id="timeline"></ul>
  <script src="/app.js" type="module"></script>
</body>
</html>
